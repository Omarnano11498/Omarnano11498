<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- network mesh -->
  <g stroke="#00C2FF" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="80" y1="60" x2="200" y2="140"/><line x1="200" y1="140" x2="120" y2="210"/>
    <line x1="200" y1="140" x2="300" y2="80"/><line x1="80" y1="60" x2="300" y2="80"/>
    <line x1="900" y1="70" x2="1020" y2="150"/><line x1="1020" y1="150" x2="1120" y2="80"/>
    <line x1="1020" y1="150" x2="960" y2="215"/><line x1="1120" y1="80" x2="1140" y2="200"/>
    <line x1="1020" y1="150" x2="1140" y2="200"/>
  </g>
  <g fill="#00C2FF">
    <circle cx="80" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="140" r="7"/>
    <circle cx="120" cy="210" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80" r="5"/>
    <circle cx="900" cy="70" r="5"/>
    <circle cx="1020" cy="150" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="80" r="5"/>
    <circle cx="960" cy="215" r="5"/>
    <circle cx="1140" cy="200" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- data packet moving along a link -->
  <circle r="4" fill="#00FFA3">
    <animateMotion dur="3s" repeatCount="indefinite" path="M80,60 L200,140 L300,80"/>
  </circle>
  <circle r="4" fill="#00FFA3">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M900,70 L1020,150 L1140,200"/>
  </circle>

  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" fill="#ffffff">Omar Khalid Ali</text>
  <rect x="470" y="140" width="260" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="185" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="22" fill="#00C2FF">Network &amp; Automation Engineer</text>
  <text x="600" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#9fb3c8">Networking · Automation · Docker · Python · C#</text>
</svg>
